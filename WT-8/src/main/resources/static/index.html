<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Score Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --success: #10b981;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .dashboard-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 550px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .header {
            background-color: var(--text-main);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            background-color: var(--text-muted);
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.3s ease;
        }

        .status-badge.live {
            background-color: var(--danger);
        }

        .status-badge.live::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            background-color: #f8fafc;
        }

        .controls input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .controls input:focus {
            border-color: var(--primary);
        }

        .controls button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .controls button:hover {
            background-color: var(--primary-hover);
        }

        .controls button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        .match-data {
            padding: 20px;
            display: none;
            transition: background-color 0.3s ease;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .score {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .overs {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .players-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .player-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .player-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .commentary-box {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #1e3a8a;
        }

        /* Highlight animation when score updates */
        @keyframes highlight {
            0% { background-color: #fef08a; }
            100% { background-color: transparent; }
        }
        .update-flash {
            animation: highlight 1s ease-out;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="header">
        <h2>🏏 Live Match Center</h2>
        <div id="status-indicator" class="status-badge">Offline</div>
    </div>

    <div class="controls">
        <input type="number" id="matchId" value="1" placeholder="Enter Match ID">
        <button id="connectBtn" onclick="toggleConnection()">Connect</button>
    </div>

    <div id="live-feed" class="match-data">
        <div class="score-row">
            <div>
                <div class="player-label">Current Score</div>
                <div class="score" id="score-display">0/0</div>
            </div>
            <div class="overs">Overs: <span id="overs-display" style="font-weight: 700; color: var(--text-main);">0.0</span></div>
        </div>

        <div class="players-grid">
            <div>
                <div class="player-label">🏏 Striker</div>
                <div class="player-name" id="batsman-display">-</div>
            </div>
            <div>
                <div class="player-label">🥎 Bowler</div>
                <div class="player-name" id="bowler-display">-</div>
            </div>
        </div>

        <div class="commentary-box">
            <strong style="display: block; margin-bottom: 5px; font-size: 0.8rem; text-transform: uppercase;">Latest Update</strong>
            <span id="commentary-display">Waiting for first ball...</span>
        </div>
    </div>
</div>

<script>
    let stompClient = null;
    let isConnected = false;

    const connectBtn = document.getElementById('connectBtn');
    const matchIdInput = document.getElementById('matchId');
    const statusIndicator = document.getElementById('status-indicator');
    const liveFeed = document.getElementById('live-feed');

    function toggleConnection() {
        if (isConnected) {
            disconnectFromMatch();
        } else {
            subscribeToMatch();
        }
    }

    function subscribeToMatch() {
        const matchId = matchIdInput.value;
        if (!matchId) return alert("Please enter a valid Match ID");

        connectBtn.innerText = "Connecting...";
        connectBtn.disabled = true;
        matchIdInput.disabled = true;

        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);

        // Disable debug logs in console for a cleaner production feel
        stompClient.debug = null;

        stompClient.connect({}, function (frame) {
            isConnected = true;
            connectBtn.innerText = "Disconnect";
            connectBtn.disabled = false;
            connectBtn.style.backgroundColor = "var(--text-muted)";

            statusIndicator.innerText = "LIVE";
            statusIndicator.classList.add("live");
            liveFeed.style.display = 'block';

            stompClient.subscribe('/topic/match/' + matchId, function (message) {
                const update = JSON.parse(message.body);
                updateUI(update);
            });
        }, function(error) {
            // Handle connection failure
            alert("Connection failed. Make sure the server is running.");
            resetUI();
        });
    }

    function disconnectFromMatch() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        resetUI();
    }

    function resetUI() {
        isConnected = false;
        connectBtn.innerText = "Connect";
        connectBtn.disabled = false;
        connectBtn.style.backgroundColor = "var(--primary)";
        matchIdInput.disabled = false;

        statusIndicator.innerText = "Offline";
        statusIndicator.classList.remove("live");
        liveFeed.style.display = 'none';

        // Reset data fields
        document.getElementById('score-display').innerText = "0/0";
        document.getElementById('overs-display').innerText = "0.0";
        document.getElementById('batsman-display').innerText = "-";
        document.getElementById('bowler-display').innerText = "-";
        document.getElementById('commentary-display').innerText = "Waiting for first ball...";
    }

    function updateUI(data) {
        document.getElementById('score-display').innerText = data.totalRuns + '/' + data.totalWickets;
        document.getElementById('overs-display').innerText = data.currentOver.toFixed(1);
        document.getElementById('batsman-display').innerText = data.batsman;
        document.getElementById('bowler-display').innerText = data.bowler;
        document.getElementById('commentary-display').innerText = data.commentary;

        // Add a subtle flash effect to indicate fresh data
        liveFeed.classList.remove('update-flash');
        // Trigger reflow to restart animation
        void liveFeed.offsetWidth;
        liveFeed.classList.add('update-flash');
    }
</script>

</body>
</html>
